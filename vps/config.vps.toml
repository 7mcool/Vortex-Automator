# OPUSCLIP — extraits longs
[opusclip]
credits_par_mois = 300
fenetre_max_s = 2700
fenetre_min_s = 900
credits_max_par_projet = 50
clip_min_s = 420
clip_max_s = 900
clip_plancher_s = 60
modele = "ClipBasic"
genre = "Auto"
# Remise au 10/08 : le sermon du 3 a été traité, rouvrir la date n'aurait
# fait que remonter du fonds de catalogue. On repart du neuf.
traiter_a_partir_de = "2026-08-10"
fraicheur_max_jours = 5
sermons_par_jour = 1
chaines_reservees = ["JACAMESSANLIVE", "lamaisondesagesse"]
jour_ouverture_autres = 32
# Sans réponse sur Telegram au bout de ce délai, le sermon part tout seul —
# à condition que TOUS les principes soient vérifiés (chaîne d'Amessan,
# prédication repérée et non supposée, plafond du jour, budget du mois).
delai_auto_h = 3
# Le silence ne vaut accord que pour du neuf : un sermon plus vieux que ceci
# exige un GO explicite (le 11/08, un sermon du 3 est parti seul a 1 h 30).
fraicheur_auto_jours = 2

# Heures laissees au PC pour ecouter le sermon avant qu'on pose la question.
# YouTube met une a deux heures a rendre telechargeable un direct de 2 h 30 :
# demander avant, c'est envoyer un horaire et un cout qui ne seront plus les
# bons, et s'interdire le depart automatique faute de reperage.
# 12 h : c'est le delai laisse au PC pour s'allumer et ecouter le sermon.
# Michel eteint parfois sa machine, et la tache Windows est reglee pour
# rattraper des l'allumage. Tant que ce delai court, on ne pose pas de
# question — un sermon reste exploitable cinq jours, rien ne presse.
# Passe ce delai, on demande quand meme, en signalant que la predication est
# SUPPOSEE : ce sermon-la n'aura pas le droit de partir tout seul, Michel
# tranchera depuis son telephone.
attente_reperage_h = 12

