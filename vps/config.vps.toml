# Configuration Vortex Automator — VPS (chemins conteneur Docker)

[paths]
source_dir = '/app/videos/hedjav'
tokkit_db = '/app/videos/tokkit-inutilise.sqlite'   # pas de 4K Tokkit sur le VPS (légendes via .info.json)
data_dir = '/app/data'
client_secret_file = '/app/secrets/client_secret.json'
token_file = '/app/secrets/youtube_token.json'

[publish]
facebook_publish = true
instagram_publish = true
# CADENCE RÉDUITE le 31/07/2026, sur décision de Michel et sur les chiffres :
# à 5 publications/jour ou moins, une vidéo faisait 160 vues médianes entre 3
# et 8 jours ; à 6-8/jour, 53. Publier plus rapportait moins, même en total
# (5 × 160 = 800 contre 8 × 53 = 424). Michel a tranché : 4 par jour.
#
# Les HEURES viennent elles aussi de la mesure (vues médianes des vidéos de 3
# jours et plus, heure locale) : midi +64 %, 18h +28 %, 15h au niveau de la
# médiane, 9h −23 %, minuit −40 %, 21h −46 %. On garde donc la fenêtre
# éveillée et on évite la nuit et la fin de soirée.
#
# Pour changer la cadence : ajuster ces deux lignes ensemble (autant d'heures
# que la limite), puis relancer `vps/replanifier.py` pour réétaler l'existant.
hours = [7, 12, 16, 19]             # 4 créneaux par jour
daily_limit = 4
timezone = "Africa/Porto-Novo"
category_id = "27"
language = "fr"
made_for_kids = false
notify_subscribers = true
playlist_id = ""
upload_captions = false

[tiktok]
# TikTok est maintenant la priorité de distribution : 7 extraits/jour via
# Submagic, séparés des 4 uploads YouTube qui restent contraints par le quota.
hours = [7, 10, 12, 14, 16, 19, 21]
daily_limit = 7

[whisper]
model = "small"
device = "cpu"
compute_type = "int8"

[seo]
channel_name = "Sophos PropheTikos"
known_speakers = ["Jacques Amessan", "Mohammed Sanogo"]
hashtags = ["#foi", "#motivation", "#predication"]
max_title_len = 95
tags_count = 15

[video]
shorts_max_seconds = 180
min_duration_seconds = 5

