# Configuration Vortex Automator — AUCUN SECRET ICI (les secrets vont dans .env / secrets/)

[paths]
source_dir = 'videos\clips_horizontaux'             # sortie 16:9 du découpeur
tokkit_db = 'E:\hedjav\4K Tokkit\data.sqlite'
data_dir = 'data'                                   # relatif à la racine du dépôt
client_secret_file = 'secrets\client_secret.json'
token_file = 'secrets\youtube_token.json'
# relatifs au dépôt, sinon Python les résoudrait en C:\app\videos\... — un
# chemin avec racine mais sans lettre de lecteur n'est pas absolu sous Windows.

[publish]
hours = [7, 12, 16, 19]          # 4 créneaux par jour (mesure du 31/07)
daily_limit = 4
timezone = "Africa/Porto-Novo"   # Cotonou, Bénin (UTC+1, sans heure d'été)
category_id = "27"               # Éducation
language = "fr"
made_for_kids = false
notify_subscribers = true
playlist_id = ""
# Sous-titres via l'API : coûte 400 unités de quota/vidéo. Désactivé pour tenir
# 4 uploads/jour dans le quota gratuit (10 000/j) — YouTube auto-génère les
# sous-titres de toute façon ; les fichiers .srt restent dans data/subtitles.
upload_captions = false

[tiktok]
# Grille PROPRE À TIKTOK, indépendante de celle de YouTube.
#
# Décision de Michel (07/08) : les extraits d'un même sermon sortent TOUS le
# même jour, et la nuit après minuit est autorisée. Un culte qui se termine à
# 23 h voit donc ses extraits partir à 0 h, 2 h, 4 h et 7 h, sans attendre le
# matin. Le planificateur prend simplement les prochains créneaux libres.
#
# ⚠️ Pour mémoire, mesuré sur YouTube le 31/07 : minuit −40 % de vues, 21 h
# −46 %, midi +64 %. Michel a choisi la réactivité plutôt que ces créneaux —
# c'est un arbitrage assumé, et TikTok ne se comporte pas comme YouTube.
hours = [0, 2, 4, 7, 10, 12, 14, 16, 19, 21]
daily_limit = 10

[whisper]
model = "small"        # small = bon compromis vitesse/qualité sur CPU
device = "cpu"
compute_type = "int8"

[seo]
channel_name = "Sophos PropheTikos"
# Orateurs possibles — le système n'attribue un nom QUE s'il est clairement
# identifiable dans la légende ou la transcription de la vidéo.
known_speakers = ["Jacques Amessan", "Mohammed Sanogo", "Yannick Djatti", "Aimé Bodjiyé"]
hashtags = ["#foi", "#motivation", "#predication"]
max_title_len = 95
tags_count = 15

[video]
shorts_max_seconds = 180   # Shorts YouTube : jusqu'à 3 minutes
min_duration_seconds = 5

# ---------------------------------------------------------------------------
# DÉCOUPAGE DES LONGUES VIDÉOS YOUTUBE (Submagic)
#
# On vise les DIRECTS et les vidéos très longues des chaînes ci-dessous : c'est
# là qu'est la matière. Submagic télécharge la vidéo lui-même depuis YouTube,
# la découpe, recadre sur le visage et incruste les sous-titres.
#
# Coût : 1 crédit Magic Clips par vidéo envoyée, quelle que soit sa durée —
# donc toujours privilégier un direct de 3 h à une vidéo de 20 min.
[clipping]
source_duree_min_s = 1800   # 30 min : en dessous, ce n'est pas un sermon complet
# RÉPARTITION DES DEUX MOTEURS (Michel, 09/08, après avoir jugé les rendus) :
#   Submagic  →  2 à 5 minutes    (ce bloc)
#   OpusClip  →  5 minutes et plus (voir [opusclip])
# Les deux gammes se touchent sans se recouvrir : un même passage n'est jamais
# produit deux fois, et chaque outil travaille là où il est bon.
#
# La règle éditoriale de fond ne change pas : un extrait doit porter
# l'affirmation choc ET son explication complète. C'est pourquoi le gros du
# volume passe désormais par OpusClip, qui seul dépasse 5 minutes.
clip_min_s = 120            # 2 min
# 300 s = 5 minutes, PLAFOND DUR de l'API Submagic : au-delà elle répond
# « maxClipLength must be between 15 and 300 » (vérifié le 03/08). C'est
# exactement pourquoi OpusClip prend le relais au-dessus.
clip_max_s = 300
gabarit = "Sara"            # style de sous-titres (`vortex gabarits` les liste)
suivi_visage = true
projets_par_jour = 2        # garde-fou : 2 crédits/jour maximum
clips_retenus_par_source = 5
note_minimale = 55          # note de viralité Submagic en dessous de laquelle on jette
langue = "fr"

# Pour ajouter une chaîne : copier un bloc, mettre le @handle, puis lancer
