# ---------------------------------------------------------------------------
# OPUSCLIP — extraits plus longs que ce que Submagic sait faire
#
# ⚠️ FACTURATION : 1 crédit = 1 MINUTE DE VIDÉO IMPORTÉE, pas par extrait.
# Un direct de 3 h 25 envoyé en entier coûte 205 crédits. Avec 300 crédits par
# mois, cela ferait UN sermon et demi.
#
# D'où la règle posée par Michel le 05/08 : on ne vise QUE la prédication.
# `vortex/fenetre.py` la repère en lisant les sous-titres YouTube (gratuit),
# et le plafond ci-dessous garantit qu'aucune erreur ne produit une facture
# surprise. À 60 minutes par sermon : 5 sermons par mois.
[opusclip]
credits_par_mois = 300           # ce que Michel a réellement — sert au décompte
# 45 min = 45 crédits, donc 6 sermons par mois avec de la marge (Michel, 06/08 :
# « on doit faire au moins plus que 5 sermons par mois »). Et 45 minutes
# contiennent 3 extraits de 15 min ou 6 de 7 min — largement le minimum de 2.
fenetre_max_s = 2700
fenetre_min_s = 900              # en dessous de 15 min, la fenêtre est suspecte
credits_max_par_projet = 50      # refus net au-delà, quoi que dise l'IA
# Règle éditoriale de Michel : l'affirmation choc ET son explication entière.
# Il a tranché le 06/08 : « minimum 7 min jusqu'à 15 min ».
clip_min_s = 420                 # 7 min — ce qu'on DEMANDE
clip_max_s = 900                 # 15 min
# ⚠️ OpusClip ne respecte PAS la durée minimale demandée. Mesuré le 09/08 sur
# le premier projet réel : pour 7-15 min demandées, il a rendu 9 min 30,
# 5 min 36 et… 18 secondes. Le maximum est tenu, le minimum non.
#
# CE PLANCHER N'EST PAS LE CRITÈRE — c'est une VÉRIFICATION. Michel, 09/08 :
# « on privilégie la complétude de la vidéo, la durée sert à vérifier ; une
# vidéo complète expliquant un hook ne peut pas faire moins d'une minute ».
#
# Autrement dit : ce n'est pas la brièveté qui disqualifie un extrait, c'est
# le fait qu'il ne se tienne pas. Mais une durée sous la minute PROUVE qu'il
# ne se tient pas — on n'énonce pas une affirmation et son explication en
# quarante secondes. Le seuil sert donc de contrôle de cohérence.
#
# Ce qui a écarté le morceau de 18 secondes du premier projet, c'est d'abord
# le contrôle de recouvrement : il était recopié de la fin d'un autre extrait.
clip_plancher_s = 60
modele = "ClipBasic"             # ClipBasic = orateur face caméra ; ClipAnything sinon
genre = "Auto"
# ON NE VISE QUE LE NEUF (Michel, 06/08 : « la conférence Sophos est déjà
# passée, on vise les nouveaux »). Deux verrous, qui doivent tous deux passer.
#
# 1. LA BASCULE. Rien de publié AVANT cette date ne part au découpage. C'est
#    ce qui met de côté les 15 conférences Sophos : elles datent de 8 jours,
#    donc « fraîches » au sens du délai, mais l'événement est passé.
#    Pour rouvrir la réserve un jour : reculer cette date.
traiter_a_partir_de = "2026-08-07"
# 2. LE DÉLAI. Même après la bascule, un sermon qui a dormi plus longtemps que
#    ceci ne part plus : le budget est trop serré pour rattraper le retard.
fraicheur_max_jours = 12
# ⚠️ PLAFOND QUOTIDIEN — la leçon du 10/08.
# Le cycle automatique a dépensé 90 crédits en vingt minutes (deux sermons
# d'affilée) parce que rien ne bridait la CADENCE : seul le total mensuel
# était surveillé. Un sermon par jour au maximum, quoi qu'il arrive.
sermons_par_jour = 1

# STRATÉGIE (Michel, 10/08) : « on vise ceux du pasteur Jacques Amessan tout
# au long du mois, et à la fin, quand il en reste, on choisit aléatoirement
# entre les autres chaînes. »
#
# Le budget est donc RÉSERVÉ à Amessan. Ses deux chaînes produisent 11 à 15
# sermons longs par mois pour un budget de 6 : il y a toujours de quoi faire,
# et c'est lui qui rapporte le plus (23 800 vues médianes par sermon, contre
# 12 000 pour Vases d'Honneur, 7 600 pour Djatti, 1 060 pour le CCR).
chaines_reservees = ["JACAMESSANLIVE", "lamaisondesagesse"]
# Jour du mois à partir duquel les autres chaînes deviennent éligibles, s'il
# reste des crédits. Avant cette date, le budget n'est dépensé que pour
# Amessan — même si aucun de ses sermons n'est disponible ce jour-là.
jour_ouverture_autres = 32

# ---------------------------------------------------------------------------
# LIVRAISON PAR COURRIEL
# Tant que la publication automatique sur TikTok n'est pas possible (l'app
# « Sophos Publisher » a été refusée le 31/07), les extraits partent par mail.
[courriel]
destinataires = ["hedjav@gmail.com", "7ememichelcool@gmail.com"]
expediteur = ""             # laissé vide = identique à SMTP_USER
serveur = "smtp.gmail.com"
port = 587
# Mesuré le 03/08 : Submagic rend des extraits de 90 s à 110-120 Mo. Aucun ne
# tiendra jamais dans un courriel (Gmail plafonne à 25 Mo), et les télécharger
# pour rien coûterait 500 Mo de trafic par envoi sur le serveur. On envoie donc
# le LIEN de téléchargement, qui s'ouvre très bien depuis un téléphone.
pieces_jointes = false
taille_max_mo = 20          # si un jour on repasse à true
